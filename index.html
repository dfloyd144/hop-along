<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Hop Along</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* layout: one screen. Score bar on top, the playfield in the middle, one big HOP button at the bottom. */
:root{
  --ink:#1f2a44; --ink-soft:#2c3a5c; --paper:#fff8ec; --sun:#ffc94d; --hop:#ff6b5e; --hop-deep:#c9443a; --mint:#8ee6c0;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bar,.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-block:8px}
.score{display:flex;align-items:baseline;gap:10px;min-width:0}
.score b{font-size:2.6rem;line-height:1;font-weight:800;color:var(--sun);font-variant-numeric:tabular-nums}
.score span{font-size:.95rem;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
.worlds{margin-left:auto;display:flex;gap:6px}
.worlds button{font:600 1rem var(--font);color:var(--paper);background:var(--ink-soft);border:2px solid transparent;border-radius:999px;padding:4px 14px;cursor:pointer}
.worlds #mode{background:var(--sun);color:var(--ink)}
#hearts{color:var(--hop);opacity:1;font-size:1.3rem;letter-spacing:.1em}
.worlds button[data-w][aria-pressed="true"]{background:var(--mint);color:var(--ink);border-color:var(--paper)}
.field{flex:1;min-height:0;position:relative;background:var(--ink-soft)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.card{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(86%,340px);background:var(--paper);color:var(--ink);
  border-radius:24px;padding:18px 20px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.card h1{margin:0;font-size:2rem;line-height:1.1;font-weight:800;text-wrap:balance}
.card p{margin:6px 0 0;font-size:1.1rem;font-weight:600;line-height:1.3}
.pad{padding-block:12px}
#hop{width:100%;height:88px;border:0;border-radius:24px;background:var(--hop);color:var(--paper);font:800 2.2rem var(--font);letter-spacing:.06em;
  box-shadow:0 8px 0 var(--hop-deep);cursor:pointer}
#hop:active,#hop.down{transform:translateY(6px);box-shadow:0 2px 0 var(--hop-deep)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
</style>

</head>
<body>
<div class="bar">
  <div class="score"><b id="score">0</b><span id="best">Best 0</span><span id="hearts"></span></div>
  <div class="worlds" role="group" aria-label="Pick a world">
    <button id="w-meadow" data-w="meadow" aria-pressed="true">Meadow</button>
    <button id="w-reef" data-w="reef" aria-pressed="false">Reef</button>
    <button id="w-cave" data-w="cave" aria-pressed="false">Cave</button>
    <button id="mode" aria-pressed="true">Easy</button>
  </div>
</div>
<div class="field" id="field">
  <canvas id="cv"></canvas>
  <div class="card" id="card"><h1 id="cardT">Hop Along</h1><p id="cardP">Tap HOP to go forward. Every hop is 1 point. Wait for a gap before you cross!</p></div>
</div>
<div class="pad"><button id="hop">HOP</button></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const field = $('field'), cv = $('cv'), ctx = cv.getContext('2d');
  const WORLDS = {
    meadow: { safe: ['#8fdc7a', '#83d36d'], lane: '#5b6475', mark: '#eeeadb', rail: '#7b6450', hero: 'bunny', cars: ['#ff6b5e', '#ffc94d', '#5aa9ff', '#b98cff', '#ff9ecf'], big: '#f2f2f2', train: '#e2483d', warn: 'Train!' },
    reef: { safe: ['#f6dfa4', '#efd592'], lane: '#2f7fb8', mark: '#7cc0ea', rail: '#1f5f96', hero: 'axolotl', cars: ['#ffb347', '#ff7fa8', '#ffe066', '#8ee6c0', '#c9a6ff'], big: '#8d9bb0', train: '#3b5f9a', warn: 'Whale!' },
    cave: { safe: ['#9383b3', '#8978aa'], lane: '#54466f', mark: '#b7a6d9', rail: '#463a5e', hero: 'gnome', cars: ['#ff6b5e', '#5aa9ff', '#ffc94d', '#8ee6c0', '#ff9ecf'], big: '#c9a36b', train: '#a79c96', warn: 'Rocks!' },
  };
  let world = 'meadow', Wd = WORLDS.meadow;
  let W = 300, H = 400, cell = 56, dpr = 1;
  let rows = [], T = 0, cam = 0, state = 'ready', deadAt = 0, score = 0;
  const p = { row: 0, vis: 0, hop: 0 };
  let easy = true, lives = 3, safeUntil = 0, safeRow = 0;
  // little friends who hop along beside the hero (cave world). They wait on safe ground, so nothing can bump them.
  const buds = [[-2.4, '#5aa9ff'], [-1.2, '#ffc94d'], [1.2, '#8ee6c0'], [2.4, '#ff9ecf']].map(([col, hat]) => ({ col, hat, vis: 0 }));
  const bestKey = () => world + (easy ? '-easy' : '');
  const best = {};
  try { Object.assign(best, JSON.parse(localStorage.getItem('hopBest') || '{}')); } catch (e) { /* no storage: fine */ }

  /* ---------- sound (starts on the first tap) ---------- */
  let ac;
  const blip = (f, d, type, v) => {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.7, t + d);
      g.gain.setValueAtTime(v || 0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
    } catch (e) { /* no sound: fine */ }
  };

  /* ---------- rows ---------- */
  const rnd = Math.random, pick = (a) => a[(rnd() * a.length) | 0];
  const hash = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  function makeRow(i) {
    if (i < 3) return { t: 'safe' };
    let run = 0; for (let k = i - 1; k >= 0 && rows[k].t !== 'safe'; k--) run++;
    const r = rnd(), d = easy ? Math.min(0.3, i / 500) : Math.min(1, i / 150); // d: gets harder the further she goes
    let t = run >= (easy ? 2 : 3) ? 'safe' : r < (easy ? 0.45 : 0.32) ? 'safe' : r < 0.88 ? 'road' : 'rail';
    if (t === 'rail' && (rows[i - 1].t === 'rail' || i < (easy ? 15 : 8))) t = 'road';
    if (t === 'road') {
      const big = rnd() < 0.3;
      return { t, big, dir: rnd() < 0.5 ? 1 : -1, speed: (1.5 + rnd() * 1.1 + d * 2.4) * (easy ? 0.6 : 1), gap: (big ? 6.6 : 4.8) + rnd() * 2.6 - d * 0.9 + (easy ? 2 : 0), len: big ? 2.3 : 1.25, phase: rnd() * 10, color: pick(Wd.cars) };
    }
    if (t === 'rail') return { t, dir: rnd() < 0.5 ? 1 : -1, st: 'idle', next: T + 1.5 + rnd() * 3.5, x: 0 };
    return { t: 'safe' };
  }
  const need = () => { while (rows.length < p.row + 30) rows.push(makeRow(rows.length)); };
  const TRAIN_LEN = 16, TRAIN_SPEED = 24;
  const roadDist = (r) => { const ph = (((r.phase + r.dir * r.speed * T) % r.gap) + r.gap) % r.gap; return Math.min(ph, r.gap - ph); };
  const roadPhase = (r) => (((r.phase + r.dir * r.speed * T) % r.gap) + r.gap) % r.gap;
  function stepRail(r, dt) {
    const edge = W / cell / 2 + 2;
    if (r.st === 'idle' && T >= r.next) { r.st = 'warn'; r.until = T + (easy ? 2.4 : 1.3); }
    else if (r.st === 'warn' && T >= r.until) { r.st = 'run'; r.x = -r.dir * edge; if (Math.abs(rows.indexOf(r) - p.row) < 8) blip(140, 0.5, 'sawtooth', 0.06); }
    else if (r.st === 'run') { r.x += r.dir * TRAIN_SPEED * dt; if (r.dir * r.x - TRAIN_LEN > edge) { r.st = 'idle'; r.next = T + 2 + rnd() * 4; } }
  }
  const hit = (r) => {
    if (r.t === 'road') return roadDist(r) < r.len / 2 + 0.3;
    if (r.t === 'rail' && r.st === 'run') { const head = r.x, tail = r.x - r.dir * TRAIN_LEN; return Math.min(head, tail) < 0.35 && Math.max(head, tail) > -0.35; }
    return false;
  };

  /* ---------- game flow ---------- */
  function reset() {
    rows = []; T = 0; cam = 0; score = 0; p.row = 0; p.vis = 0; p.hop = 0; state = 'ready'; need();
    lives = easy ? 3 : 1; safeUntil = 0; safeRow = 0; buds.forEach((b) => { b.vis = 0; }); hearts();
    $('score').textContent = '0'; $('best').textContent = 'Best ' + (best[bestKey()] || 0);
    $('cardT').textContent = 'Hop Along'; $('cardP').textContent = easy ? 'Tap HOP to go forward. Every hop is 1 point. You have 3 hearts!' : 'Tap HOP to go forward. Every hop is 1 point. Wait for a gap before you cross!';
    $('card').hidden = false; $('hop').textContent = 'HOP';
  }
  function hearts() { $('hearts').textContent = easy ? '\u2665'.repeat(Math.max(0, lives)) : ''; }
  function bump() {
    if (T < safeUntil) return;
    lives--; hearts();
    if (lives <= 0) { die(); return; }
    safeUntil = T + 1.8; blip(260, 0.2, 'square', 0.07);
  }
  function hop() {
    if (state === 'dead') { if (performance.now() - deadAt > 700) reset(); return; }
    if (state === 'ready') { state = 'play'; $('card').hidden = true; }
    p.row++; p.hop = 1; score++; need();
    if (rows[p.row].t === 'safe') safeRow = p.row;
    $('score').textContent = score;
    blip(520 + (score % 5) * 40, 0.09);
  }
  function die() {
    state = 'dead'; deadAt = performance.now();
    blip(200, 0.35, 'square', 0.08);
    const was = best[bestKey()] || 0;
    if (score > was) { best[bestKey()] = score; try { localStorage.setItem('hopBest', JSON.stringify(best)); } catch (e) { /* fine */ } }
    $('cardT').textContent = 'Bonk!';
    $('cardP').textContent = score > was && was > 0 ? `New best! You made ${score} hops.` : `You made ${score} hop${score === 1 ? '' : 's'}. Try again!`;
    $('best').textContent = 'Best ' + (best[bestKey()] || 0);
    $('card').hidden = false; $('hop').textContent = 'PLAY AGAIN';
  }

  /* ---------- drawing ---------- */
  const rr = (x, y, w, h, r, fill) => { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
  const circ = (x, y, r, fill) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = fill; ctx.fill(); };
  const oval = (x, y, a, b, fill) => { ctx.beginPath(); ctx.ellipse(x, y, a, b, 0, 0, 7); ctx.fillStyle = fill; ctx.fill(); };
  const tri = (x1, y1, x2, y2, x3, y3, fill) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };

  function drawMover(x, y, r) {
    const c = cell, w = r.len * c, h = c * 0.62, d = r.dir;
    if (world === 'meadow') {
      [-1, 1].forEach((s) => [-1, 1].forEach((q) => rr(x + q * w * 0.3 - c * 0.12, y + s * h * 0.5 - c * 0.07, c * 0.24, c * 0.14, 4, '#2b2f3a')));
      rr(x - w / 2, y - h / 2, w, h, c * 0.16, r.big ? Wd.big : r.color);
      if (r.big) rr(d > 0 ? x + w / 2 - c * 0.62 : x - w / 2, y - h / 2, c * 0.62, h, c * 0.16, r.color);
      rr(x + d * (w / 2 - c * 0.42) - c * 0.11, y - h * 0.36, c * 0.22, h * 0.72, 4, '#cfeaff');
    } else if (world === 'reef') {
      const col = r.big ? Wd.big : r.color;
      tri(x - d * w * 0.34, y, x - d * w * 0.56, y - h * 0.5, x - d * w * 0.56, y + h * 0.5, col);
      oval(x + d * w * 0.04, y, w * 0.42, h * 0.48, col);
      if (r.big) tri(x - w * 0.12, y - h * 0.4, x + w * 0.12, y - h * 0.4, x - d * w * 0.06, y - h * 0.86, col);
      else oval(x, y + h * 0.1, w * 0.14, h * 0.2, 'rgba(255,255,255,.45)');
      circ(x + d * w * 0.28, y - h * 0.1, c * 0.07, '#fff'); circ(x + d * w * 0.3, y - h * 0.1, c * 0.035, '#1f2a44');
    } else {
      // a mine cart full of gems
      const n = r.big ? 5 : 3, gems = ['#8ee6c0', '#ffc94d', '#ff9ecf', '#9fd2ff'];
      [-0.3, 0.3].forEach((q) => circ(x + q * w, y + h * 0.42, c * 0.11, '#2b2f3a'));
      for (let k = 0; k < n; k++) { const gx = x + ((k + 0.5) / n - 0.5) * w * 0.8; tri(gx - c * 0.15, y - h * 0.2, gx + c * 0.15, y - h * 0.2, gx, y - h * 0.66, gems[k % 4]); }
      rr(x - w / 2, y - h * 0.25, w, h * 0.62, c * 0.12, r.big ? Wd.big : r.color);
      rr(x - w / 2, y - h * 0.25, w, h * 0.14, 4, 'rgba(0,0,0,.18)');
    }
  }
  function drawTrain(r, y) {
    const c = cell, head = W / 2 + r.x * c, tail = head - r.dir * TRAIN_LEN * c, x0 = Math.min(head, tail), h = c * 0.7;
    if (world === 'cave') { // a row of rolling rocks
      for (let k = 0.5; k < TRAIN_LEN; k += 1.05) { const bx = x0 + k * c; circ(bx, y, c * 0.44, Wd.train); circ(bx - c * 0.12, y - c * 0.12, c * 0.1, 'rgba(255,255,255,.3)'); circ(bx + c * 0.14, y + c * 0.1, c * 0.07, 'rgba(0,0,0,.18)'); }
      return;
    }
    rr(x0, y - h / 2, TRAIN_LEN * c, h, world === 'reef' ? h : c * 0.14, Wd.train);
    if (world === 'reef') { circ(head - r.dir * c * 0.9, y - h * 0.12, c * 0.09, '#fff'); circ(head - r.dir * c * 0.86, y - h * 0.12, c * 0.045, '#1f2a44'); tri(tail, y, tail - r.dir * c, y - h * 0.7, tail - r.dir * c, y + h * 0.7, Wd.train); }
    else for (let k = 0.6; k < TRAIN_LEN; k += 1.4) rr(x0 + k * c, y - h * 0.26, c * 0.8, h * 0.52, 5, '#ffe9a8');
  }
  function drawHero(x, y, squash, hat, sc) {
    const c = cell, s = c * 0.36 * (sc || 1), hero = Wd.hero;
    oval(x, y + s * 0.95, s * 0.9, s * 0.28, 'rgba(0,0,0,.2)');
    ctx.save(); ctx.translate(x, y + s * 0.9); ctx.scale(1 + (1 - squash) * 0.5, squash); ctx.translate(0, -s * 0.9);
    if (hero === 'bunny') {
      [-1, 1].forEach((k) => { oval(k * s * 0.42, -s * 1.25, s * 0.24, s * 0.7, '#fff'); oval(k * s * 0.42, -s * 1.2, s * 0.11, s * 0.5, '#ffc2d6'); });
      circ(0, 0, s, '#fff'); circ(-s * 0.36, -s * 0.1, s * 0.13, '#2b2f3a'); circ(s * 0.36, -s * 0.1, s * 0.13, '#2b2f3a');
      circ(-s * 0.6, s * 0.25, s * 0.16, '#ffc2d6'); circ(s * 0.6, s * 0.25, s * 0.16, '#ffc2d6'); tri(-s * 0.12, s * 0.15, s * 0.12, s * 0.15, 0, s * 0.32, '#ff8fb0');
    } else if (hero === 'axolotl') {
      ctx.strokeStyle = '#e0609a'; ctx.lineWidth = s * 0.2; ctx.lineCap = 'round';
      [-1, 1].forEach((k) => [-0.5, 0, 0.5].forEach((a) => { ctx.beginPath(); ctx.moveTo(k * s * 0.8, a * s * 0.5 - s * 0.2); ctx.lineTo(k * s * 1.45, a * s * 1.1 - s * 0.4); ctx.stroke(); }));
      oval(0, 0, s * 1.1, s * 0.9, '#ffb3d4'); circ(-s * 0.45, -s * 0.12, s * 0.12, '#2b2f3a'); circ(s * 0.45, -s * 0.12, s * 0.12, '#2b2f3a');
      ctx.strokeStyle = '#7a4a5a'; ctx.lineWidth = s * 0.09; ctx.beginPath(); ctx.arc(0, s * 0.1, s * 0.4, 0.5, 2.64); ctx.stroke();
    } else {
      // a little cave gnome: pointy hat with a glowing tip, round face, fluffy beard
      tri(-s * 0.9, -s * 0.4, s * 0.9, -s * 0.4, 0, -s * 1.9, hat || '#ff6b5e'); circ(0, -s * 1.9, s * 0.34, 'rgba(255,233,150,.35)'); circ(0, -s * 1.9, s * 0.17, '#fff3c4');
      circ(0, 0, s * 0.9, '#ffd9b8'); oval(0, s * 0.52, s * 0.82, s * 0.58, '#fff');
      circ(-s * 0.32, -s * 0.12, s * 0.12, '#2b2f3a'); circ(s * 0.32, -s * 0.12, s * 0.12, '#2b2f3a'); circ(0, s * 0.12, s * 0.15, '#ffb08a');
    }
    ctx.restore();
  }
  function drawDeco(i, y) {
    for (let k = 0; k < 3; k++) {
      const gx = (hash(i, k) - 0.5) * (W / cell + 1); if (Math.abs(gx) < 1.1 || hash(i, k + 9) < 0.35) continue;
      const x = W / 2 + gx * cell, yy = y + (hash(i, k + 5) - 0.5) * cell * 0.4, c = cell;
      if (world === 'meadow') { if (hash(i, k + 3) < 0.5) { circ(x, yy, c * 0.24, '#5fbf5a'); circ(x - c * 0.14, yy - c * 0.1, c * 0.16, '#6fcc68'); } else { for (let a = 0; a < 5; a++) circ(x + Math.cos(a * 1.257) * c * 0.1, yy + Math.sin(a * 1.257) * c * 0.1, c * 0.07, hash(i, k + 4) < 0.5 ? '#fff' : '#ff9ecf'); circ(x, yy, c * 0.06, '#ffc94d'); } }
      else if (world === 'reef') { if (hash(i, k + 3) < 0.5) { oval(x, yy, c * 0.2, c * 0.15, '#ff9ecf'); oval(x, yy, c * 0.1, c * 0.07, '#ffd3e6'); } else { ctx.strokeStyle = '#4fb88a'; ctx.lineWidth = c * 0.09; ctx.lineCap = 'round'; [-1, 0, 1].forEach((q) => { ctx.beginPath(); ctx.moveTo(x + q * c * 0.12, yy + c * 0.25); ctx.quadraticCurveTo(x + q * c * 0.3 + Math.sin(T * 2 + i) * 4, yy, x + q * c * 0.12, yy - c * 0.28); ctx.stroke(); }); } }
      else if (hash(i, k + 3) < 0.55) { const col = ['#8ee6c0', '#9fd2ff', '#ff9ecf'][(hash(i, k + 4) * 3) | 0]; circ(x, yy, c * 0.34, 'rgba(255,255,255,.1)'); tri(x - c * 0.13, yy + c * 0.2, x + c * 0.13, yy + c * 0.2, x, yy - c * 0.32, col); tri(x + c * 0.02, yy + c * 0.2, x + c * 0.26, yy + c * 0.2, x + c * 0.17, yy - c * 0.08, col); }
      else { circ(x, yy, c * 0.28, 'rgba(255,220,120,.14)'); rr(x - c * 0.05, yy, c * 0.1, c * 0.2, 3, '#f5ead8'); oval(x, yy, c * 0.2, c * 0.12, '#ffc94d'); }
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const c = cell, base = H - c * 2.4, first = Math.max(0, Math.floor(cam) - 3), last = Math.ceil(cam + base / c) + 1;
    for (let i = last; i >= first; i--) {
      const r = rows[i]; if (!r) continue;
      const y = base - (i - cam) * c;
      if (r.t === 'safe') { ctx.fillStyle = Wd.safe[i % 2]; ctx.fillRect(0, y - c / 2, W, c + 1); drawDeco(i, y); }
      else if (r.t === 'road') {
        ctx.fillStyle = Wd.lane; ctx.fillRect(0, y - c / 2, W, c + 1);
        if (rows[i + 1] && rows[i + 1].t === 'road') { ctx.fillStyle = Wd.mark; for (let x = (W / 2) % (c * 1.2) - c * 1.2; x < W; x += c * 1.2) ctx.fillRect(x, y - c / 2 - 2, c * 0.5, 4); }
      } else {
        ctx.fillStyle = Wd.rail; ctx.fillRect(0, y - c / 2, W, c + 1);
        if (world === 'meadow') { ctx.fillStyle = '#5d4a3a'; for (let x = (W / 2) % (c * 0.5) - c * 0.5; x < W; x += c * 0.5) ctx.fillRect(x, y - c * 0.36, c * 0.14, c * 0.72); ctx.fillStyle = '#c9ccd4'; ctx.fillRect(0, y - c * 0.26, W, 4); ctx.fillRect(0, y + c * 0.22, W, 4); }
        else for (let k = 0; k < 6; k++) circ(hash(i, k) * W, y + (hash(i, k + 7) - 0.5) * c * 0.7, 2 + hash(i, k + 2) * 3, world === 'reef' ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.7)');
      }
    }
    // movers and the hero go on top of the ground, far rows first
    for (let i = last; i >= first; i--) {
      const r = rows[i]; if (!r) continue;
      const y = base - (i - cam) * c;
      if (r.t === 'road') { const ph = roadPhase(r), n = Math.ceil(W / c / r.gap / 2) + 1; for (let k = -n; k <= n; k++) drawMover(W / 2 + (ph + k * r.gap) * c, y, r); }
      if (r.t === 'rail') {
        if (r.st === 'run') drawTrain(r, y);
        if (r.st === 'warn') {
          const on = ((T * 7) | 0) % 2 === 0;
          [c * 0.5, W - c * 0.5].forEach((x) => { circ(x, y, c * 0.3, '#2b2f3a'); circ(x, y, c * 0.2, on ? '#ff4d4d' : '#7a2a2a'); });
          ctx.fillStyle = on ? '#fff' : 'rgba(255,255,255,.6)'; ctx.font = `800 ${c * 0.42}px "Baloo 2",sans-serif`; ctx.textAlign = 'center'; ctx.fillText(Wd.warn, W / 2 + c * 2.2, y + c * 0.15);
        }
      }
      if (world === 'cave') buds.forEach((b) => { if (i === Math.round(b.vis)) drawHero(W / 2 + b.col * c, base - (b.vis - cam) * c - Math.abs(Math.sin((b.vis % 1) * Math.PI)) * c * 0.3, 1, b.hat, 0.8); });
      if (i === Math.round(p.vis) && !(T < safeUntil && ((T * 10) | 0) % 2)) { // she blinks for a moment after a bump
        const y2 = base - (p.vis - cam) * c - Math.sin(p.hop * Math.PI) * c * 0.3;
        drawHero(W / 2, y2, state === 'dead' ? 0.35 : 1 - Math.sin(p.hop * Math.PI) * 0.12);
      }
    }
  }

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state !== 'dead') {
      T += dt;
      for (let i = Math.max(0, p.row - 4); i < Math.min(rows.length, p.row + 24); i++) if (rows[i].t === 'rail') stepRail(rows[i], dt);
      if (state === 'play' && hit(rows[p.row])) bump();
    }
    p.hop = Math.max(0, p.hop - dt * 8);
    p.vis += (p.row - p.vis) * Math.min(1, dt * 22);
    buds.forEach((b, k) => { b.vis += (safeRow - b.vis) * Math.min(1, dt * (5 + k * 1.5)); });
    cam += (p.row - cam) * Math.min(1, dt * 9);
    draw();
    requestAnimationFrame(frame);
  }
  function resize() {
    const r = field.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2); W = Math.max(200, r.width); H = Math.max(200, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cell = Math.max(44, Math.min(72, W / 8));
  }

  /* ---------- controls: the HOP button, a tap on the field, or the space bar ---------- */
  const btn = $('hop');
  const press = (e) => { e.preventDefault(); btn.classList.add('down'); setTimeout(() => btn.classList.remove('down'), 90); hop(); };
  btn.addEventListener('pointerdown', press);
  field.addEventListener('pointerdown', press);
  btn.addEventListener('click', (e) => { if (e.detail === 0) hop(); }); // keyboard "click" on the focused button
  addEventListener('keydown', (e) => { if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat && document.activeElement !== btn) { e.preventDefault(); hop(); } });
  $('mode').addEventListener('click', () => { easy = !easy; $('mode').textContent = easy ? 'Easy' : 'Tricky'; $('mode').setAttribute('aria-pressed', easy ? 'true' : 'false'); reset(); });
  document.querySelectorAll('.worlds button[data-w]').forEach((b) => b.addEventListener('click', () => {
    world = b.dataset.w; Wd = WORLDS[world];
    document.querySelectorAll('.worlds button[data-w]').forEach((o) => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
    reset();
  }));
  addEventListener('resize', resize);
  resize(); reset(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
